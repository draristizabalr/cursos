<!DOCTYPE html>
<html lang="es">
  <head>
    <title>DevJobs - Inicio</title>
    <link
      rel="shortcut icon"
      href="./images/favicon/favicon-16x16.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Encuentra las mejores ofertas de trabajo para desarrolladores en DevJobs."
    />
    <link rel="stylesheet" href="./jobsStyle.css" />
    <script type="module">
      import React from "https://esm.sh/react?dev";
      import ReactDOM from "https://esm.sh/react-dom/client?dev";

      window.React = React;
      window.ReactDOM = ReactDOM;
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function JobCard({ data, titulo, ubicacion, descripcion, empresa }) {
        const [isApplied, setIsApplied] = React.useState(false);

        const textButton = isApplied ? "¡Aplicado!" : "Aplicar";
        const buttonClass = isApplied ? "is-applied" : "";

        function handleClick() {
          setIsApplied(true);
        }

        return (
          <article
            className="job-listing-card"
            data-modalidad={data.modalidad}
            data-technology={data.technology}
            data-nivel={data.nivel}
          >
            <div>
              <h3>{titulo}</h3>
              <small>
                {empresa} | {ubicacion}
              </small>
              <p>{descripcion}</p>
            </div>
            <button
              disabled={isApplied}
              class="button-apply-job"
              onClick={handleClick}
              className={`button-apply-job ${buttonClass}`}
            >
              {textButton}
            </button>
          </article>
        );
      }

      function App() {
        return (
          <div>
            <JobCard
              titulo="Desarrollador de Software Senior"
              empresa="Tech Solutions Inc."
              ubicacion="Remoto"
              descripcion="Buscamos un ingeniero de software con experiencia en desarrollo web y conocimientos en JavaScript, React y Node.js. El candidato ideal debe ser capaz de trabajar en equipo y tener buenas habilidades de comunicación."
              data={{
                technology: ["react", "node", "javascript"],
                modalidad: "remoto",
                nivel: "senior",
              }}
            />
          </div>
        );
      }

      const rootEl = document.getElementById("app-root");
      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    </script>
  </head>
  <body>
    <header>
      <h1>
        <svg
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        DevJobs
      </h1>
      <nav>
        <a href="">Inicio</a>
        <a href="./src/jobs/jobs.html">Empleos</a>
      </nav>

      <div>
        <a href="">Publicar un empleo</a>
        <!-- <a href="">Iniciar sesión</a> -->
      </div>
    </header>
    <main>
      <h2>React.js, primeros pasos</h2>

      <div id="app-root" class="jobs-listings"></div>
    </main>
    <footer>
      <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
    </footer>
  </body>
</html>
